services:
  postfix:
    image: ghcr.io/guidohu/docker-postfix/postfix:latest
    # build: .          # uncomment to build locally instead of pulling
    container_name: postfix
    restart: unless-stopped
    # Prefer binding to a LAN address, e.g. "192.168.1.10:25:25", so the relay
    # is not reachable from the internet.
    ports:
      - "25:25"     # SMTP, STARTTLS
      - "465:465"   # SMTPS, implicit TLS ("SSL")
      - "587:587"   # submission, STARTTLS required
    environment:
      maildomain: mail.example.com
      smtp_user_file: /run/secrets/smtp_users
      max_recipients: "2"         # recipients per message
      # Each user may send as user@maildomain. Grant more sender addresses
      # ("address:user") or whole domains ("@domain:user"), comma-separated:
      # smtp_senders: "scanner@example.com:printer,@example.com:alice"
      # restrict_senders: "no"        # allow any sender address (not recommended)
      # tls_min_version: TLSv1.2      # raise once no legacy device needs TLS 1.0/1.1
      # allow_plaintext_auth: "yes"   # only if a device cannot do TLS at all
    secrets:
      - smtp_users
    volumes:
      - ./assets/certs:/etc/postfix/certs:ro
      - postfix-queue:/var/spool/postfix   # keep queued mail across re-creates
    # Postfix's master process must be uid 0 inside the container, so strip
    # that "root" down to the minimum (verified by tests/smoke-test.sh):
    #   SETUID, SETGID  - start every daemon as the unprivileged postfix user
    #   DAC_OVERRIDE    - master (root) creates sockets in postfix-owned queue dirs
    # Ports below 1024 need no capability: Docker sets
    # net.ipv4.ip_unprivileged_port_start=0 inside the container. With
    # network_mode: host, add NET_BIND_SERVICE.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  smtp_users:
    file: ./smtp_users.txt   # one "user:password" per line; keep out of git

volumes:
  postfix-queue:
